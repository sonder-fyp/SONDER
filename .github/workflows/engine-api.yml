name: Engine API checkpoint
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional adapter and test dependencies
        run: python -m pip install -e '.[api,api-test]'
      - name: Test real engine HTTP adapter without a database
        run: python -m unittest discover -s tests -p 'test_engine_api.py' -v
