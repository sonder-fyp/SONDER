name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04 # Pinned so a runner image change does not alter CI behaviour unexpectedly.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Sonder-UI-master
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: Sonder-UI-master/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  math-data:
    name: math-data
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test dataset validator
        run: python -m unittest discover -s tests -p 'test_math_dataset.py' -v

      - name: Check Maths bank structure and source batches
        run: python -m validation.math_dataset

  engine:
    name: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine (with the eval extra for the evaluation figures)
        run: python -m pip install -e '.[eval]'

      - name: Test pure engine calculations
        run: python -m unittest discover -s tests -p 'test_bayes*.py' -v

      - name: Test question selection
        run: python -m unittest discover -s tests -p 'test_selection.py' -v

      - name: Test pack loader, stopping and run loop
        run: python -m unittest discover -s tests -p 'test_engine_*.py' -v

  db:
    name: db
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine (the import probe builds units with the engine's loader)
        run: python -m pip install -e .

      - name: Start throwaway PostgreSQL 16 (docker-compose.yml; no secrets, not Neon)
        run: docker compose up -d --wait

      - name: Run schema, behaviour and import-probe checks
        run: python docs/db/iteration1/tests/run_schema_tests.py

      - name: Discard the database
        if: always()
        run: docker compose down -v

  persistence:
    name: persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SONDER_TEST_DATABASE_URL: postgresql://sonder:local-test-only@127.0.0.1:55432/sonder_test
      SONDER_REQUIRE_DB_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine, API and database extras
        run: python -m pip install -e '.[api,api-test,db]'

      - name: Start throwaway PostgreSQL 16 (docker-compose.yml; no secrets, not Neon)
        run: docker compose up -d --wait

      - name: Migrations, persistent sessions and access checks
        run: python -m unittest discover -s tests -p 'test_persist_*.py' -v

      - name: Classes, enrolment and assignment rules
        run: python -m unittest discover -s tests -p 'test_product_*.py' -v

      - name: Discard the database
        if: always()
        run: docker compose down -v
