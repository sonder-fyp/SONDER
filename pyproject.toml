[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonder-engine"
version = "0.1.0"
description = "Pure deterministic calculations for SONDER diagnostic sessions"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3"]

[project.optional-dependencies]
api = ["fastapi==0.120.0", "uvicorn==0.38.0"]
api-test = ["httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["sonder_engine*"]
